<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">FlipPlay Media Collection API</title>
  <desc id="desc">Animated code rain behind a bold blue-purple FlipPlay canopy.</desc>
  <defs>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2=".15">
      <stop stop-color="#181848"/>
      <stop offset=".48" stop-color="#293b91"/>
      <stop offset="1" stop-color="#0799c7"/>
    </linearGradient>
    <linearGradient id="canopyShine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8f9cff" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#9eeeff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#8f9cff" stop-opacity=".03"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#102335" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <pattern id="codeRain" width="1200" height="540" patternUnits="userSpaceOnUse">
      <g font-family="monospace" font-size="12">
        <g fill="#45d9ca">
          <text x="24" y="18">$ php artisan route:list</text>
          <text x="24" y="58">01001000 01100101 01101100</text>
          <text x="24" y="98">Route::apiResource('media');</text>
          <text x="24" y="138">$ php artisan test</text>
          <text x="24" y="178">return response()-&gt;json($data);</text>
          <text x="24" y="218">01010110 10010101 01100101</text>
          <text x="24" y="258">composer install --no-interaction</text>
          <text x="24" y="298">public function index(Request $request)</text>
          <text x="24" y="338">10101001 01101010 11001010</text>
          <text x="24" y="378">$media = Media::with('users')-&gt;get();</text>
          <text x="24" y="418">git push origin main</text>
          <text x="24" y="458">if ($request-&gt;validated()) { ... }</text>
          <text x="24" y="498">01001101 01100101 01100100</text>
          <text x="24" y="538">[ API :: status = nominal ]</text>
        </g>
        <g fill="#62d9f5">
          <text x="250" y="38">const stream = await connect();</text>
          <text x="250" y="78">SELECT * FROM media;</text>
          <text x="250" y="118">10110010 00110101 11001001</text>
          <text x="250" y="158">await fetch('/api/media');</text>
          <text x="250" y="198">[ OK ] secure channel active</text>
          <text x="250" y="238">return $this-&gt;belongsToMany(User::class);</text>
          <text x="250" y="278">01101010 10010101 00110110</text>
          <text x="250" y="318">npm run build</text>
          <text x="250" y="358">try { await sync(); } catch (e) { }</text>
          <text x="250" y="398">php artisan migrate --force</text>
          <text x="250" y="438">01010101 11001010 00110101</text>
          <text x="250" y="478">const payload = { status: 'ready' };</text>
          <text x="250" y="518">git status --short</text>
        </g>
        <g fill="#79caff">
          <text x="505" y="18">Route::post('/users/{user}/media');</text>
          <text x="505" y="58">11001010 01010101 10100110</text>
          <text x="505" y="98">return new MediaResource($media);</text>
          <text x="505" y="138">[root@flipplay ~]$ tail -f api.log</text>
          <text x="505" y="178">&lt;response status="200" /&gt;</text>
          <text x="505" y="218">const result = await response.json();</text>
          <text x="505" y="258">10101010 01010101 11001100</text>
          <text x="505" y="298">docker compose up -d</text>
          <text x="505" y="338">Media::findOrFail($id);</text>
          <text x="505" y="378">01001010 10101001 01101010</text>
          <text x="505" y="418">php artisan optimize</text>
          <text x="505" y="458">await Promise.all(requests);</text>
          <text x="505" y="498">return response()-&gt;noContent();</text>
          <text x="505" y="538">[ CLI ] listening on :8000</text>
        </g>
        <g fill="#48caba">
          <text x="790" y="38">use App\\Models\\Media;</text>
          <text x="790" y="78">01001100 01101111 01100001</text>
          <text x="790" y="118">-&gt;where('active', true)-&gt;get();</text>
          <text x="790" y="158">git log --oneline -5</text>
          <text x="790" y="198">[ OK ] database connection</text>
          <text x="790" y="238">if (!$exists) { abort(404); }</text>
          <text x="790" y="278">10110100 00101101 11001010</text>
          <text x="790" y="318">php artisan config:clear</text>
          <text x="790" y="358">{ "collection": "FlipPlay" }</text>
          <text x="790" y="398">01010101 00110011 10101010</text>
          <text x="790" y="438">composer test</text>
          <text x="790" y="478">await client.get('/api/media/1');</text>
          <text x="790" y="518">01101001 01101110 01100100</text>
        </g>
        <g fill="#46b9e8">
          <text x="1010" y="18">01010101 00110011 10101010</text>
          <text x="1010" y="58">php artisan migrate</text>
          <text x="1010" y="98">[ system :: status = nominal ]</text>
          <text x="1010" y="138">public function store() { ... }</text>
          <text x="1010" y="178">return response()-&gt;json($data);</text>
          <text x="1010" y="218">10101010 00110101 01101010</text>
          <text x="1010" y="258">[root@api ~]$ composer test</text>
          <text x="1010" y="298">use Illuminate\\Http\\Request;</text>
          <text x="1010" y="338">01001101 10101010 01100011</text>
          <text x="1010" y="378">git status --short</text>
          <text x="1010" y="418">await response.json();</text>
          <text x="1010" y="458">SELECT id, title FROM media;</text>
          <text x="1010" y="498">01010110 11001010 00101101</text>
          <text x="1010" y="538">[ stream :: connected ]</text>
        </g>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 540" dur="24s" repeatCount="indefinite"/>
    </pattern>
    <filter id="codeSoftness" x="-.1" y="-.1" width="1.2" height="1.2">
      <feGaussianBlur stdDeviation=".55"/>
    </filter>
    <filter id="titleGlow" x="-.2" y="-.3" width="1.4" height="1.6">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="540" fill="#0D1117"/>
  <ellipse cx="600" cy="260" rx="620" ry="390" fill="url(#ambient)"/>
  <rect width="1200" height="540" fill="url(#codeRain)" opacity=".55" filter="url(#codeSoftness)"/>
  <path d="M38 303C152 151 343 113 600 113s448 38 562 190c-76-49-136-44-193 9-35 33-61 72-88 105-31-59-65-94-111-107-55-15-113 5-170 75-57-70-115-90-170-75-46 13-80 48-111 107-27-33-53-72-88-105-57-53-117-58-193-9Z" fill="url(#canopy)"/>
  <path d="M54 294C190 173 374 136 600 136s410 37 546 158c-92-51-153-36-205 9-28 25-49 57-68 82-33-47-65-75-105-87-52-15-107 2-168 61-61-59-116-76-168-61-40 12-72 40-105 87-19-25-40-57-68-82-52-45-113-60-205-9Z" fill="url(#canopyShine)" opacity=".65"/>
  <path d="M38 303C152 151 343 113 600 113s448 38 562 190" fill="none" stroke="#8bdcff" stroke-opacity=".22" stroke-width="2"/>
  <text x="600" y="260" text-anchor="middle" fill="#f3f6ff" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="1" filter="url(#titleGlow)">FlipPlay</text>
  <text x="600" y="303" text-anchor="middle" fill="#dbe4ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2">MEDIA COLLECTION API</text>
  <g fill="#65e8df">
    <circle cx="92" cy="373" r="2" opacity=".8"><animate attributeName="cy" values="373;487;373" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1104" cy="395" r="1.8" opacity=".75"><animate attributeName="cy" values="395;500;395" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="352" r="1.4" opacity=".65"><animate attributeName="cy" values="352;488;352" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="166" cy="430" r="1.5" opacity=".7"><animate attributeName="cy" values="430;510;430" dur="6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
