<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">FlipPlay Media Collection API</title>
  <desc id="desc">A GitHub-dark banner with smoothly looping downward code streams behind crisp FlipPlay branding.</desc>
  <defs>
    <linearGradient id="codeColors" x1="0" x2="1">
      <stop stop-color="#58a6ff"/>
      <stop offset=".48" stop-color="#39d0c3"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <radialGradient id="centerShade">
      <stop offset="0" stop-color="#0D1117" stop-opacity=".68"/>
      <stop offset=".5" stop-color="#0D1117" stop-opacity=".48"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#00d9ff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop stop-color="#7567ff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7567ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="codeRain" width="1200" height="480" patternUnits="userSpaceOnUse">
      <g font-family="monospace" font-size="12">
        <g fill="#58a6ff">
          <text x="24" y="18">$ php artisan route:list</text>
          <text x="24" y="66">Route::apiResource('media');</text>
          <text x="24" y="114">01001101 01100101 01100100</text>
          <text x="24" y="162">return response()-&gt;json($data);</text>
          <text x="24" y="210">git push origin main</text>
          <text x="24" y="258">class MediaController extends Controller</text>
          <text x="24" y="306">10101001 01101010 11001010</text>
          <text x="24" y="354">$ php artisan test</text>
          <text x="24" y="402">if ($request-&gt;validated()) { ... }</text>
          <text x="24" y="450">01010110 10010101 01100101</text>
        </g>
        <g fill="#39d0c3">
          <text x="188" y="42">const stream = await connect();</text>
          <text x="188" y="90">SELECT * FROM media;</text>
          <text x="188" y="138">01010101 11001010 00110101</text>
          <text x="188" y="186">await fetch('/api/media');</text>
          <text x="188" y="234">[ OK ] secure channel active</text>
          <text x="188" y="282">return $this-&gt;belongsToMany(User::class);</text>
          <text x="188" y="330">01101010 10010101 00110110</text>
          <text x="188" y="378">npm run build</text>
          <text x="188" y="426">try { await sync(); } catch (e) { }</text>
          <text x="188" y="474">10110010 00110101 11001001</text>
        </g>
        <g fill="#8bbcff">
          <text x="390" y="18">public function index(Request $request)</text>
          <text x="390" y="66">01001100 01101111 01100001</text>
          <text x="390" y="114">$media = Media::with('users')-&gt;get();</text>
          <text x="390" y="162">[root@flipplay ~]$ tail -f api.log</text>
          <text x="390" y="210">&lt;response status="200" /&gt;</text>
          <text x="390" y="258">const payload = { status: 'ready' };</text>
          <text x="390" y="306">10101010 01010101 11001100</text>
          <text x="390" y="354">composer test</text>
          <text x="390" y="402">-&gt;where('active', true)-&gt;get();</text>
          <text x="390" y="450">01001010 10101001 01101010</text>
        </g>
        <g fill="#52d6bd">
          <text x="614" y="42">if (ready) { return response; }</text>
          <text x="614" y="90">php artisan migrate --force</text>
          <text x="614" y="138">11001010 01010101 10100110</text>
          <text x="614" y="186">use App\\Models\\Media;</text>
          <text x="614" y="234">[ API :: status = nominal ]</text>
          <text x="614" y="282">await client.get('/api/media/1');</text>
          <text x="614" y="330">01001101 10101010 01100011</text>
          <text x="614" y="378">git status --short</text>
          <text x="614" y="426">{ "collection": "FlipPlay" }</text>
          <text x="614" y="474">10011001 01100101 10101010</text>
        </g>
        <g fill="#a99aff">
          <text x="844" y="18">Route::post('/users/{user}/media');</text>
          <text x="844" y="66">01100101 01101110 01100100</text>
          <text x="844" y="114">return new MediaResource($media);</text>
          <text x="844" y="162">docker compose up -d</text>
          <text x="844" y="210">[ OK ] database connection</text>
          <text x="844" y="258">const result = await response.json();</text>
          <text x="844" y="306">10110100 00101101 11001010</text>
          <text x="844" y="354">php artisan config:clear</text>
          <text x="844" y="402">if (!$exists) { abort(404); }</text>
          <text x="844" y="450">01010101 00110011 10101010</text>
        </g>
        <g fill="#39d0c3">
          <text x="1050" y="42">&lt;status&gt; connected &lt;/status&gt;</text>
          <text x="1050" y="90">10101010 00110101 01101010</text>
          <text x="1050" y="138">git log --oneline -5</text>
          <text x="1050" y="186">Media::findOrFail($id);</text>
          <text x="1050" y="234">[ CLI ] listening on :8000</text>
          <text x="1050" y="282">01001010 10100101 11010001</text>
          <text x="1050" y="330">await Promise.all(requests);</text>
          <text x="1050" y="378">php artisan optimize</text>
          <text x="1050" y="426">return response()-&gt;noContent();</text>
          <text x="1050" y="474">11001010 00110101 01010101</text>
        </g>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 480" dur="24s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="binaryRain" width="1200" height="360" patternUnits="userSpaceOnUse">
      <g fill="#58a6ff" font-family="monospace" font-size="10" opacity=".8">
        <text x="92" y="20">01010110 11001010 00101101</text>
        <text x="315" y="68">10101001 01011010 11010001</text>
        <text x="550" y="116">00110101 10010110 01001011</text>
        <text x="760" y="164">11001010 01010101 10100110</text>
        <text x="980" y="212">01001101 10101010 01100011</text>
        <text x="255" y="260">10110010 00110101 11001001</text>
        <text x="685" y="308">01101010 10010101 00110110</text>
        <text x="35" y="356">10011001 01100101 10101010</text>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 360" dur="31s" repeatCount="indefinite"/>
    </pattern>
    <filter id="softBlur" x="-.1" y="-.1" width="1.2" height="1.2">
      <feGaussianBlur stdDeviation=".9"/>
    </filter>
  </defs>
  <rect width="1200" height="340" fill="#0D1117"/>
  <ellipse cx="145" cy="170" rx="360" ry="230" fill="url(#cyanGlow)"/>
  <ellipse cx="1050" cy="170" rx="360" ry="230" fill="url(#blueGlow)"/>
  <rect width="1200" height="340" fill="url(#codeRain)" opacity=".34"/>
  <rect width="1200" height="340" fill="url(#binaryRain)" opacity=".18" filter="url(#softBlur)"/>
  <rect width="1200" height="340" fill="url(#centerShade)"/>
  <path d="M340 136 Q600 30 860 136" fill="none" stroke="#667bff" stroke-width="2" stroke-linecap="round" opacity=".58"/>
  <path d="M390 145 Q600 62 810 145" fill="none" stroke="#40d9ff" stroke-width="1" stroke-linecap="round" opacity=".45"/>
  <text x="600" y="178" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="1">FlipPlay</text>
  <text x="600" y="216" text-anchor="middle" fill="#b9c9dc" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="5">MEDIA COLLECTION API</text>
  <g fill="#75e8ff">
    <circle cx="185" cy="94" r="1.5" opacity=".7">
      <animate attributeName="cy" values="94;278;94" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.8;.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1018" cy="252" r="1.5" opacity=".65">
      <animate attributeName="cy" values="252;70;252" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".1;.75;.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="108" r="1" opacity=".6">
      <animate attributeName="cy" values="108;292;108" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
