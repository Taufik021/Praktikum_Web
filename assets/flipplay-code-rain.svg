<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">FlipPlay Media Collection API</title>
  <desc id="desc">A GitHub-dark animated code-rain banner with FlipPlay and Laravel branding.</desc>
  <defs>
    <linearGradient id="canopy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#181848"/>
      <stop offset="50%" stop-color="#293b91"/>
      <stop offset="100%" stop-color="#078fbd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#8beaff" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="codeRain" width="1200" height="760" patternUnits="userSpaceOnUse">
      <g font-family="monospace" font-size="12">
        <g fill="#46d8c6">
          <text x="24" y="24">$ php artisan route:list</text>
          <text x="24" y="72">01001000 01100101 01101100</text>
          <text x="24" y="120">Route::apiResource('media');</text>
          <text x="24" y="168">return response()-&gt;json($data);</text>
          <text x="24" y="216">[ OK ] database connection</text>
          <text x="24" y="264">10101001 01101010 11001010</text>
          <text x="24" y="312">$ php artisan test</text>
          <text x="24" y="360">class MediaController extends Controller</text>
          <text x="24" y="408">01010110 10010101 01100101</text>
          <text x="24" y="456">git push origin main</text>
          <text x="24" y="504">$media = Media::with('users')-&gt;get();</text>
          <text x="24" y="552">10110010 00110101 11001001</text>
          <text x="24" y="600">composer install --no-interaction</text>
          <text x="24" y="648">if ($request-&gt;validated()) { ... }</text>
          <text x="24" y="696">01001101 01100101 01100100</text>
          <text x="24" y="744">[ API :: status = nominal ]</text>
        </g>
        <g fill="#66c9ff">
          <text x="275" y="48">const stream = await connect();</text>
          <text x="275" y="96">SELECT * FROM media;</text>
          <text x="275" y="144">01101010 10010101 00110110</text>
          <text x="275" y="192">await fetch('/api/media');</text>
          <text x="275" y="240">git status --short</text>
          <text x="275" y="288">return $this-&gt;belongsToMany(User::class);</text>
          <text x="275" y="336">01010101 11001010 00110101</text>
          <text x="275" y="384">npm run build</text>
          <text x="275" y="432">try { await sync(); } catch (e) { }</text>
          <text x="275" y="480">php artisan migrate --force</text>
          <text x="275" y="528">10101010 01010101 11001100</text>
          <text x="275" y="576">const payload = { status: 'ready' };</text>
          <text x="275" y="624">docker compose up -d</text>
          <text x="275" y="672">await client.get('/api/media/1');</text>
          <text x="275" y="720">01001100 01101111 01100001</text>
        </g>
        <g fill="#79caff">
          <text x="555" y="24">public function index(Request $request)</text>
          <text x="555" y="72">11001010 01010101 10100110</text>
          <text x="555" y="120">return new MediaResource($media);</text>
          <text x="555" y="168">[root@flipplay ~]$ tail -f api.log</text>
          <text x="555" y="216">&lt;response status="200" /&gt;</text>
          <text x="555" y="264">const result = await response.json();</text>
          <text x="555" y="312">10101010 01010101 11001100</text>
          <text x="555" y="360">Media::findOrFail($id);</text>
          <text x="555" y="408">php artisan optimize</text>
          <text x="555" y="456">await Promise.all(requests);</text>
          <text x="555" y="504">01001010 10101001 01101010</text>
          <text x="555" y="552">return response()-&gt;noContent();</text>
          <text x="555" y="600">composer test</text>
          <text x="555" y="648">use App\\Models\\Media;</text>
          <text x="555" y="696">01101001 01101110 01100100</text>
          <text x="555" y="744">[ CLI ] listening on :8000</text>
        </g>
        <g fill="#55cbb8">
          <text x="835" y="48">if (ready) { return response; }</text>
          <text x="835" y="96">php artisan migrate</text>
          <text x="835" y="144">01001101 10101010 01100011</text>
          <text x="835" y="192">use Illuminate\\Http\\Request;</text>
          <text x="835" y="240">[ system :: status = nominal ]</text>
          <text x="835" y="288">Route::post('/users/{user}/media');</text>
          <text x="835" y="336">10110100 00101101 11001010</text>
          <text x="835" y="384">php artisan config:clear</text>
          <text x="835" y="432">{ "collection": "FlipPlay" }</text>
          <text x="835" y="480">git log --oneline -5</text>
          <text x="835" y="528">01010101 00110011 10101010</text>
          <text x="835" y="576">if (!$exists) { abort(404); }</text>
          <text x="835" y="624">return response()-&gt;json($data);</text>
          <text x="835" y="672">SELECT id, title FROM media;</text>
          <text x="835" y="720">10101010 00110101 01101010</text>
        </g>
        <g fill="#52b9e8">
          <text x="1060" y="24">01010101 00110011 10101010</text>
          <text x="1060" y="72">[root@api ~]$ composer test</text>
          <text x="1060" y="120">return await fetch('/api/media');</text>
          <text x="1060" y="168">[ OK ] secure channel active</text>
          <text x="1060" y="216">public function store() { ... }</text>
          <text x="1060" y="264">01001010 10100101 11010001</text>
          <text x="1060" y="312">git status --short</text>
          <text x="1060" y="360">await response.json();</text>
          <text x="1060" y="408">php artisan route:list</text>
          <text x="1060" y="456">10101010 00110101 01101010</text>
          <text x="1060" y="504">[ database :: connected ]</text>
          <text x="1060" y="552">Media::with('users')-&gt;get();</text>
          <text x="1060" y="600">docker compose up -d</text>
          <text x="1060" y="648">01001101 01100101 01100100</text>
          <text x="1060" y="696">[ stream :: connected ]</text>
          <text x="1060" y="744">php artisan optimize</text>
        </g>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 760" dur="28s" repeatCount="indefinite"/>
    </pattern>
    <radialGradient id="shade">
      <stop offset="0" stop-color="#0D1117" stop-opacity=".68"/>
      <stop offset=".62" stop-color="#0D1117" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="codeBlur" x="-.1" y="-.1" width="1.2" height="1.2">
      <feGaussianBlur stdDeviation=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#0D1117"/>
  <rect width="1200" height="760" fill="url(#codeRain)" opacity=".72" filter="url(#codeBlur)"/>
  <rect width="1200" height="760" fill="url(#shade)"/>
  <path d="M42 490 C150 280 350 190 600 190 C850 190 1050 280 1158 490 C1050 420 980 440 910 545 C830 420 735 400 600 525 C465 400 370 420 290 545 C220 440 150 420 42 490 Z" fill="url(#canopy)"/>
  <path d="M42 490 C150 280 350 190 600 190 C850 190 1050 280 1158 490" fill="none" stroke="#9be6ff" stroke-opacity=".35" stroke-width="2"/>
  <path d="M290 545 C370 420 465 400 600 525 C735 400 830 420 910 545" fill="none" stroke="url(#sheen)" stroke-width="3"/>
  <text x="600" y="365" text-anchor="middle" fill="#f3f6ff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700" letter-spacing="1">FlipPlay</text>
  <text x="600" y="411" text-anchor="middle" fill="#e1e8ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2">MEDIA COLLECTION API</text>
  <g fill="none" stroke="#ff493d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M401 605 L421 594 L441 605 L441 649 L421 660 L401 649 Z"/>
    <path d="M401 605 L421 616 L441 605 M421 616 L421 660"/>
    <path d="M441 615 L461 604 L481 615 L481 649 L461 660 L441 649"/>
    <path d="M441 615 L461 626 L481 615 M461 626 L461 660"/>
    <path d="M481 625 L501 614 L521 625 L521 649 L501 660 L481 649"/>
    <path d="M481 625 L501 636 L521 625 M501 636 L501 660"/>
  </g>
  <text x="548" y="649" fill="#ff493d" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="600" letter-spacing="-2">Laravel</text>
  <g fill="#54e5de">
    <circle cx="92" cy="572" r="2"><animate attributeName="cy" values="572;735;572" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1104" cy="600" r="2"><animate attributeName="cy" values="600;735;600" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="555" r="1.5"><animate attributeName="cy" values="555;720;555" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="645" r="1.5"><animate attributeName="cy" values="645;735;645" dur="6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
