<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FlipPlay ambient code rain</title>
  <desc id="desc">A dark, softly blurred animated stream of code with a clear center.</desc>
  <defs>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow">
      <stop offset="0" stop-color="#ff36c7" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff36c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeFade" x1="0" x2="1">
      <stop offset="0" stop-color="white"/>
      <stop offset=".22" stop-color="white" stop-opacity=".65"/>
      <stop offset=".38" stop-color="black" stop-opacity=".08"/>
      <stop offset=".5" stop-color="black"/>
      <stop offset=".62" stop-color="black" stop-opacity=".08"/>
      <stop offset=".78" stop-color="white" stop-opacity=".65"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="clearCenter">
      <rect width="1200" height="320" fill="url(#edgeFade)"/>
    </mask>
    <filter id="softBlur" x="-.2" y="-.2" width="1.4" height="1.4">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
    <filter id="deepBlur" x="-.2" y="-.2" width="1.4" height="1.4">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="codeRain" width="1200" height="360" patternUnits="userSpaceOnUse">
      <g fill="#71efff" font-family="monospace" font-size="13">
        <text x="28" y="18">const stream = await connect();</text>
        <text x="28" y="53">01001000 01100101 01101100</text>
        <text x="28" y="88">if (ready) { return response; }</text>
        <text x="28" y="123">&lt;node id="0x7f" /&gt;</text>
        <text x="28" y="158">while (signal) { listen(); }</text>
        <text x="28" y="193">10110100 00101101 11001010</text>
        <text x="28" y="228">git push origin main</text>
        <text x="28" y="263">[ OK ] encrypted channel open</text>
        <text x="28" y="298">fn() =&gt; { await process(); }</text>
        <text x="28" y="333">01010110 10100101 01001110</text>
      </g>
      <g fill="#ff75dc" font-family="monospace" font-size="12">
        <text x="425" y="34">&lt;matrix&gt; 0xA13F &lt;/matrix&gt;</text>
        <text x="425" y="69">01001010 10101001 01101010</text>
        <text x="425" y="104">return await fetch("/api/media");</text>
        <text x="425" y="139">[root@flipplay ~]$ tail -f log</text>
        <text x="425" y="174">{} =&gt; [] =&gt; &lt;/&gt;</text>
        <text x="425" y="209">const key = 0x7E2C;</text>
        <text x="425" y="244">10101010 01010101 11001100</text>
        <text x="425" y="279">sudo systemctl status stream</text>
        <text x="425" y="314">try { await sync(); } catch (_) {}</text>
        <text x="425" y="349">01001101 01100001 01110100</text>
      </g>
      <g fill="#79ffc8" font-family="monospace" font-size="12">
        <text x="845" y="14">SELECT * FROM media WHERE active=1;</text>
        <text x="845" y="49">10110010 01100101 00110101</text>
        <text x="845" y="84">[ system :: status = nominal ]</text>
        <text x="845" y="119">&lt;packet&gt; 0x00FF &lt;/packet&gt;</text>
        <text x="845" y="154">for (const bit of data) { ... }</text>
        <text x="845" y="189">01010101 00110011 10101010</text>
        <text x="845" y="224">ssh tunnel --secure --quiet</text>
        <text x="845" y="259">{ "pulse": "steady", "io": "ok" }</text>
        <text x="845" y="294">01001100 01101111 01100001</text>
        <text x="845" y="329">while (true) { await breathe(); }</text>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 -360" dur="18s" repeatCount="indefinite"/>
    </pattern>
    <pattern id="binaryRain" width="1200" height="420" patternUnits="userSpaceOnUse">
      <g fill="#57dfff" font-family="monospace" font-size="11" opacity=".8">
        <text x="170" y="30">01010110 11001010 00101101</text>
        <text x="170" y="78">10101001 01011010 11010001</text>
        <text x="170" y="126">00110101 10010110 01001011</text>
        <text x="170" y="174">11001010 01010101 10100110</text>
        <text x="170" y="222">01001101 10101010 01100011</text>
        <text x="170" y="270">10110010 00110101 11001001</text>
        <text x="170" y="318">01101010 10010101 00110110</text>
        <text x="170" y="366">10011001 01100101 10101010</text>
        <text x="170" y="414">01010101 11001010 00110101</text>
      </g>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 -420" dur="27s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="#050709"/>
  <ellipse cx="145" cy="145" rx="340" ry="210" fill="url(#cyanGlow)"/>
  <ellipse cx="1060" cy="170" rx="330" ry="220" fill="url(#magentaGlow)"/>
  <g mask="url(#clearCenter)" opacity=".55" filter="url(#deepBlur)">
    <rect width="1200" height="320" fill="url(#codeRain)"/>
  </g>
  <g mask="url(#clearCenter)" opacity=".28" filter="url(#softBlur)">
    <rect width="1200" height="320" fill="url(#binaryRain)"/>
  </g>
  <g fill="none" stroke="#38dfff" stroke-opacity=".1">
    <path d="M0 1H1200"/>
    <path d="M0 319H1200"/>
  </g>
</svg>
